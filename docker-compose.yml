services:
  app:
    build: .
    container_name: shomoysoft_web
    environment:
      NODE_ENV: production
    env_file:
      - .env   # 🔐 loads secrets from .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    container_name: shomoysoft_nginx
    ports:
      - "9000:80"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      app:
        condition: service_healthy
