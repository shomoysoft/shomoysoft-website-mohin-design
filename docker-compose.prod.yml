services:
  app:
    build: .
    container_name: shomoysoft_web
    environment:
      NODE_ENV: production
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: shomoysoft_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/shomoysoft.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/shomoysoft.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    restart: always
    depends_on:
      app:
        condition: service_healthy
